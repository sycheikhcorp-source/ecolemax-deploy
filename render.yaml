services:
  - type: web
    name: ecolemax-flask
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT --timeout 120 app:app
    healthCheckPath: /health

  - type: cron
    name: keepalive
    schedule: "*/5 * * * *"
    jobCommand: curl -s https://ecolemax.onrender.com/health > /dev/null || true
