services:
  - type: web
    name: ecolemax
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: echo "Python standard — pas de dépendances"
    startCommand: python serveur.py
    healthCheckPath: /
    envVars:
      - key: ADMIN_PASSWORD
        value: ecolemax2026
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: cron
    name: ecolemax-keepalive
    runtime: python
    plan: free
    schedule: "*/10 * * * *"
    command: "python -c \"import urllib.request;urllib.request.urlopen('https://ecolemax.onrender.com/health', timeout=20).read()\""
    restartPolicy: always
