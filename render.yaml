services:
  - type: web
    name: ecolemax-flask
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 --threads 8 --worker-class gthread -b 0.0.0.0:$PORT --timeout 120 --keep-alive 75 app:app
    healthCheckPath: /health
    autoDeploy: true
    healthCheckPeriod: 300

  - type: cron
    name: ecolemax-keepalive
    plan: free
    schedule: "*/5 * * * *"
    command: "curl -s https://ecolemax.onrender.com/health"
