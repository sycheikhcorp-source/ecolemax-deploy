name: keepalive-ecolemax

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keepalive EcoleMax
        run: |
          CODE=$(curl -s -m 20 -o /dev/null -w "%{http_code}" https://ecolemax.onrender.com/health)
          echo "EcoleMax health: $CODE"
