name: Deploy to Koyeb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH
      
      - name: Deploy to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          koyeb service create ecolemax \
            --app ecolemax \
            --git github.com/sycheikhcorp-source/ecolemax-deploy \
            --git-branch main \
            --git-builder docker \
            --git-docker-dockerfile Dockerfile \
            --port 8000 \
            --route /:8000 \
            --instance-type s-01 \
            --env ADMIN_PASSWORD=ecolemax2026 \
            --env DB_PATH=/home/app/ecolemax.db
